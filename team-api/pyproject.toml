[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acq-team-api"
version = "0.1.0"
description = "acq team knowledge store API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pyjwt>=2.0",
    "bcrypt>=4.0",
    "psycopg2-binary>=2.9",
    "orgstore-pg-client @ https://binaries.ddbuild.io/dd-source/python/orgstore_pg_client-0.5.23-py2.py3-none-any.whl",
    "orgstore-pg-db-ops @ https://binaries.ddbuild.io/dd-source/python/orgstore_pg_db_ops-0.0.87237230-py3-none-any.whl",
    "orgstore-pg-test-container @ https://binaries.ddbuild.io/dd-source/python/orgstore_pg_test_container-0.0.87237230-py3-none-any.whl",
    "dd-internal-authentication @ https://binaries.ddbuild.io/dd-source/python/dd_internal_authentication-0.0.63496837-py3-none-any.whl",
    "acq-shared",
]

[project.scripts]
acq-team-api = "team_api.app:main"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "tests" },
]

lint = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.4",
]

tests = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx",
]

[tool.uv.sources]
acq-shared = { path = "../shared", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["team_api"]

[tool.ruff.lint]
ignore = [
    # FastAPI uses Depends() in function default arguments; this is intentional and idiomatic.
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
