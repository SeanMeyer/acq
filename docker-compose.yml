services:
  acq-team-api:
    build:
      context: .
      dockerfile: team-api/Dockerfile
    ports:
      - "8742:8742"
    volumes:
      - acq-data:/data
      - ./scripts:/app/scripts:ro
    environment:
      - ACQ_DB_PATH=/data/team.db
      - ACQ_JWT_SECRET=${ACQ_JWT_SECRET:?Set ACQ_JWT_SECRET}
      - ACQ_API_KEYS=${ACQ_API_KEYS:-{"default-key":"default-agent"}}
      - HUMAN_VOTE_WEIGHT=${HUMAN_VOTE_WEIGHT:-5}

  acq-team-ui:
    build: ./team-ui
    ports:
      - "3000:3000"
    depends_on:
      - acq-team-api

volumes:
  acq-data:
