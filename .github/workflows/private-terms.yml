name: Private terms

# This repo is public. Flags added lines, commit messages, and PR titles and
# descriptions that match a private list of employer-specific terms, held in
# the PRIVATE_TERMS secret so the list itself isn't published. Reports where,
# never what: these logs are public too.
#
# This is detection, not prevention: by the time it runs, the text is already
# on GitHub. The local hooks and the pre-publication check in AGENTS.md are
# what keep it from getting there.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
      # Fork PRs get no secrets, so only they may run without the list.
      REQUIRE_TERMS: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Through env, never interpolated into the script: these are untrusted.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          status=0
          python3 scripts/check_private_terms.py --diff "$BASE...$HEAD" --messages "$BASE..$HEAD" || status=1
          printf '%s\n%s\n' "$TITLE" "$BODY" | python3 scripts/check_private_terms.py --text "PR title or description" || status=1
          exit $status

      - name: Push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: python3 scripts/check_private_terms.py --diff "$BEFORE..$AFTER" --messages "$BEFORE..$AFTER"
