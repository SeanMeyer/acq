name: Publish image

# Builds the team API image (UI included) on every push to main and publishes
# it to GHCR, tagged with the commit SHA and `latest`, so a deployment can pin
# an exact build. The image carries code only, never data.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        # GHCR requires a lowercase repository path.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-team-api" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: team-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
